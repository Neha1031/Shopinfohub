{% extends 'base.html' %}

{% block title %}Sign In | ShopInfoHub{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="form-card" style="margin-top: 4rem;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div style="font-size: 3rem; margin-bottom: 1.5rem;">👋</div>
            <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Welcome</h1>
            <p style="color: var(--text-muted);">Sign in to your account to continue</p>
        </div>

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div style="position: relative;">
                    <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com" style="padding-left: 2.75rem;">
                    <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);">📧</span>
                </div>
            </div>
            
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                </div>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••" style="padding-left: 2.75rem;">
                    <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);">🔒</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1rem;">
                Sign In
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 2rem;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <a href="/register" style="font-weight: 700; color: var(--primary);">Create one for free</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
