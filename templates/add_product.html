{% extends 'base.html' %}

{% block title %}Add Product | ShopInfoHub{% endblock %}

{% block content %}
<style>
.form-group {
  margin-bottom: 2rem;
  display: flex;
  flex-direction: column;
}

.form-group label {
  display: block;
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 0.75rem;
  text-align: left;
}
</style>
<div class="fade-in">
    <div class="form-card" style="max-width: 800px; margin-top: 2rem;">
        <div style="text-align: center; margin-bottom: 3rem;">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;">📦</div>
            <h1 style="font-size: 2.25rem; font-weight: 900; margin-bottom: 0.5rem;">Add New Product</h1>
            <p style="color: var(--text-muted);">Adding to catalog: <span style="color: var(--primary); font-weight: 700;">{{ shop.shop_name }}</span></p>
        </div>

        <form method="POST" action="/addproduct/{{ shop.id }}" enctype="multipart/form-data">
            <!-- 1. Basic Info -->
            <div class="form-group">
                <label for="product_name">Product Name</label>
                <input type="text" id="product_name" name="product_name" class="form-control" required placeholder="e.g., Organic Basmati Rice">
            </div>

            <!-- 2. Detailed Description (Moved up as requested) -->
            <div class="form-group">
                <label for="voice_description">Product Full Description</label>
                <textarea id="voice_description" name="voice_description" class="form-control" rows="4" placeholder="Tell your customers everything about this product (features, benefits, etc.)"></textarea>
            </div>

            <div class="form-group">
                <label for="details">Short Summary / Highlights</label>
                <input type="text" id="details" name="details" class="form-control" placeholder="Key highlights (e.g. 100% Organic, 1 Year Warranty)">
            </div>
            
            <!-- Category Selection -->
            <div class="grid-3" style="margin-top: 1rem; margin-bottom: 2rem; background: var(--surface-alt); padding: 1.5rem; border-radius: var(--radius-sm); border: 1px dashed var(--border);">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="main_category">Main Category</label>
                    <select id="main_category" name="main_category" class="form-control" required>
                        <option value="">Select Main</option>
                        {% for cat in categories.keys() %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="sub_category">Sub Category</label>
                    <select id="sub_category" name="sub_category" class="form-control" required disabled>
                        <option value="">Select Sub</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="item_type">Item Type</label>
                    <select id="item_type" name="item_type" class="form-control" required disabled>
                        <option value="">Select Item</option>
                    </select>
                </div>
            </div>
            
            <!-- 3. Visuals -->
            <div class="form-group" style="background: var(--surface-alt); padding: 2rem; border-radius: var(--radius); border: 1px dashed var(--border);">
                <label>Product Photo</label>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <input type="file" id="product_photo_file" name="product_photo_file" class="form-control" accept="image/*" style="padding: 0.5rem; background: #fff;">
                    
                    <!-- Cropper Container -->
                    <div id="cropper_container" style="display: none; margin-top: 1rem; width: 100%; max-height: 400px; overflow: hidden; border-radius: var(--radius-sm);">
                        <img id="image_preview" style="max-width: 100%;">
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <div style="height: 1px; flex: 1; background: var(--border);"></div>
                        <span style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800;">OR PASTE LINK</span>
                        <div style="height: 1px; flex: 1; background: var(--border);"></div>
                    </div>
                    <input type="text" id="product_photo_url" name="product_photo_url" class="form-control" placeholder="https://example.com/image.jpg">
                </div>
            </div>
            
            <!-- 4. Specifications Grid -->
            <div class="grid-2" style="margin-top: 1rem;">
                <div class="form-group">
                    <label for="price">Price (₹)</label>
                    <div style="position: relative;">
                        <input type="number" id="price" name="price" class="form-control" required min="0" step="0.01" placeholder="0.00" style="padding-left: 3rem;">
                        <span style="position: absolute; left: 1.25rem; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-weight: 800;">₹</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="status">Availability</label>
                    <select id="status" name="status" class="form-control">
                        <option value="Available" selected>Available</option>
                        <option value="Out of Stock">Out of Stock</option>
                        <option value="Pre-order">Pre-order</option>
                    </select>
                </div>
            </div>
            
            <div class="grid-3">
                <div class="form-group">
                    <label for="quantity">Stock Qty</label>
                    <input type="number" id="quantity" name="quantity" class="form-control" min="0" placeholder="e.g., 50">
                </div>
                <div class="form-group">
                    <label for="weight">Weight/Size</label>
                    <input type="text" id="weight" name="weight" class="form-control" placeholder="e.g., 5 kg">
                </div>
                <div class="form-group">
                    <label for="quality">Quality</label>
                    <select id="quality" name="quality" class="form-control">
                        <option value="Premium">Premium</option>
                        <option value="Standard" selected>Standard</option>
                        <option value="Budget">Budget</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 1.5rem; margin-top: 3rem;">
                <a href="/manage_shop/{{ shop.id }}" class="btn btn-outline" style="flex: 1;">Cancel</a>
                <button type="submit" id="submit_btn" class="btn btn-primary" style="flex: 2; padding: 1.25rem;">Add to Catalog</button>
            </div>
        </form>
    </div>
</div>

<script>
    const categoryData = {{ categories | tojson | safe }};
    const mainCatSelect = document.getElementById('main_category');
    const subCatSelect = document.getElementById('sub_category');
    const itemTypeSelect = document.getElementById('item_type');

    mainCatSelect.addEventListener('change', function() {
        const main = this.value;
        subCatSelect.innerHTML = '<option value="">Select Sub</option>';
        itemTypeSelect.innerHTML = '<option value="">Select Item</option>';
        itemTypeSelect.disabled = true;

        if (main && categoryData[main]) {
            subCatSelect.disabled = false;
            for (const sub in categoryData[main]) {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                subCatSelect.appendChild(opt);
            }
        } else {
            subCatSelect.disabled = true;
        }
    });

    subCatSelect.addEventListener('change', function() {
        const main = mainCatSelect.value;
        const sub = this.value;
        itemTypeSelect.innerHTML = '<option value="">Select Item</option>';

        if (main && sub && categoryData[main][sub]) {
            itemTypeSelect.disabled = false;
            categoryData[main][sub].forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                itemTypeSelect.appendChild(opt);
            });
        } else {
            itemTypeSelect.disabled = true;
        }
    });

    let cropper;
    const imageInput = document.getElementById('product_photo_file');
    const imagePreview = document.getElementById('image_preview');
    const cropperContainer = document.getElementById('cropper_container');
    const form = document.querySelector('form');
    const submitBtn = document.getElementById('submit_btn');

    imageInput.addEventListener('change', function(e) {
        const files = e.target.files;
        if (files && files.length > 0) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                cropperContainer.style.display = 'block';
                if (cropper) {
                    cropper.destroy();
                }
                cropper = new Cropper(imagePreview, {
                    aspectRatio: 4 / 3,
                    viewMode: 1,
                    autoCropArea: 1,
                    background: false
                });
            };
            reader.readAsDataURL(files[0]);
        } else {
            cropperContainer.style.display = 'none';
            if(cropper) { cropper.destroy(); cropper = null; }
        }
    });

    form.addEventListener('submit', function(e) {
        if (cropper) {
            e.preventDefault();
            submitBtn.textContent = 'Uploading...';
            submitBtn.disabled = true;

            cropper.getCroppedCanvas({
                width: 800,
                height: 600,
                fillColor: '#fff'
            }).toBlob(function(blob) {
                const formData = new FormData(form);
                formData.set('product_photo_file', blob, 'cropped_product.jpg');
                
                fetch(form.action, {
                    method: 'POST',
                    body: formData
                }).then(res => {
                    if (res.redirected) {
                        window.location.href = res.url;
                    } else {
                        window.location.href = '/manage_shop/{{ shop.id }}';
                    }
                }).catch(err => {
                    alert('Upload failed. Please try again.');
                    submitBtn.textContent = 'Add to Catalog';
                    submitBtn.disabled = false;
                });
            }, 'image/jpeg', 0.85);
        }
    });
</script>
{% endblock %}
